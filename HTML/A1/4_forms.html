<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form action="2.html">
        <label>Name</label><br>
        <input type="text" name="username" value="abcd"><br>
        <label>Age</label><br>
        <input type="number" name="age"><br>
        <label>Gender</label><br>
        <input type="radio" name="gender" value="Male"> <label>Male</label>
        <input type="radio" name="gender" value="Female"> Female
        <br>
        <label>Country</label><br>
        <input type="radio" name="country" value="India"> India
        <input type="radio" name="country" value="Other"> Other
        <br>
        <label>Date of Birth</label><br>
        <input type="date" name="dob"> <br>
        <!-- <input type="datetime-local" name="dob"> <br> -->
        <!-- <input type="time" name="dob"> <br> -->
        <label>Mobile</label><br>
        <input type="tel" name="mob"> <br>
        <label>Email</label><br>
        <input type="email" name="email"> <br>
        <label>Profile Photo</label><br>
        <input type="file" name="image_file"> <br>
    
        <label>Language Known</label>
        <input type="checkbox" name="lang" value="Odiya"> Odiya
        <input type="checkbox" name="lang" value="English"> English
        <input type="checkbox" name="lang" value="Hindi"> Hindi
        <br>
        <label>Password</label><br>
        <input type="password" name="pass"><br>
        <!-- Dropdown -->
         <label>State</label><br>
         <select name="state" id="">
            <option value="">--Select State--</option>
            <option value="Odisha">Odisha</option>
            <option value="UP">UP</option>
            <option value="Bihar">Bihar</option>
            <option value="TN">TN</option>
         </select> <br>

        <!-- Textarea -->
         <label>Address</label><br>
         <textarea rows="5" cols="30"></textarea><br>


        <br><br>
        <input type="submit" value="Register">
        <input type="reset" value="Clear Form">
        <!-- <button type="submit">Submit</button> -->
    </form>
</body>
</html>
