<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table</title>
</head>
<body>
    <table border="1" cellpadding="10" cellspacing="0" bgcolor="yellow" align="center">
        <tr bgcolor="red">
            <th>Image</th>
            <th>Product Name</th>
            <th>Categoty</th>
            <th>Price</th>
            <th>Action</th>
        </tr>
        <tr>
            <td>
                <img src="https://image.made-in-china.com/365f3j00AWgialUmZfbF/15-6-Hot-Selling-Slim-Laptop-in-Tel-Quad-Core-Notebook-8GB-RAM-256GB-1920X1080-IPS-Laptops-Computer.webp" width="100px" height="100px">
            </td>
            <td align="center">Laptop</td>
            <td>Electronics</td>
            <td bgcolor="cyan">80000</td>
            <td>
                <a href="">Details</a>
                <a href="">Edit</a>
            </td>
        </tr>
        <tr align="center">
            <td>
                <img src="https://image.made-in-china.com/365f3j00tivjOQFBlAqR/6-7-Inch-Screen-Android-Smartphone-Dual-SIM-4000mAh-4G-Smart-Mobile-Phone.webp" alt="" height="100px" width="100px">
            </td>
            <td>Mobile</td>
            <td>Electronics</td>
            <td>20000</td>
            <td>
                <a href="">Details</a>
            </td>
        </tr>
        <tr>
            <td></td>
            <td>T-Shirt</td>
            <td>Clothing</td>
            <td>899</td>
            <td></td>
        </tr>
    </table>

    <table border="1" cellpadding="10" cellspacing="0">
        <tr>
            <td>A</td>
            <td>B</td>
            <td colspan="2">C</td>
        </tr>
        <tr>
            <td>D</td>
            <td rowspan="3">E</td>
            <td>F</td>
            <td rowspan="2">G</td>
        </tr>
        <tr>
            <td>H</td>
            <td>I</td>
        </tr>
        <tr>
            <td>J</td>
            <td colspan="2">K</td>
        </tr>
    </table>
</body>
</html>
