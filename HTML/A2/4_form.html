<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <form action="2.html">
        <label>Name</label> <br>
        <input type="text" name="username"> <br>
        <label>Age</label> <br>
        <input type="number" name="age"> <br>
        <label>DOB</label> <br>
        <input type="date" name="dob"> <br>
        <label>Time</label> <br>
        <input type="time"> <br>
        <label>Mobile</label> <br>
        <input type="tel"> <br>
        <label>Email</label> <br>
        <input type="email"> <br>
        <label>Gender</label> <br>
        
        <input type="radio" name="gender" value="M"> Male
        <input type="radio" name="gender"value="F"> Female
        <br>
        <label>County</label> <br>
        <input type="radio" name="country" value="India"> India
        <input type="radio" name="country"value="Other"> Other
        <br>
        <label>Language Known</label> <br>
        <input type="checkbox" name="language" value="Odiya"> Odiya
        <input type="checkbox"  name="language" value="Hindi"> Hindi
        <input type="checkbox"  name="language" value="Eng"> English
        <br>
        <label>Profile Image</label> <br>
        <input type="file" name="profileImage"> <br>
        <!-- Dropdown -->
         <label>State</label> <br>
         <select name="state" id="">
            <option value="">-SELECT-</option>
            <option value="Odisha">Odisha</option>
            <option value="TamilNadu">TamilNadu</option>
            <option value="UP">UP</option>
            <option value="Bihar">Bihar</option>
         </select>

        <br><br>
        <!-- Textarea -->
         <label>Address</label>
         <textarea rows="5" cols="50"></textarea>

        <br><br>
        <input type="submit" value="Register">
        <input type="reset" value="Clear Form">

        <!-- <button type="submit">Submit 2</button> -->
    </form>
    <!-- <label>Lorem ipsum dolor sit amet.</label> -->
     <br>
     <br>
     <br>
</body>
</html>
