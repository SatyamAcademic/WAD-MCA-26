<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: black;
            color: white;
            font-family: sans-serif;
        }
        .login-card{
            width: 400px;
            margin: 100px auto;
            background-color: white;
            color: black;
            padding: 20px;
            border-radius: 16px;
        }
        .login-card h3{
            margin-bottom: 20px;
        }
        .input, .btn{
            display: block;
            width: 100%;
        }
        .input {
            border: none;
            border-bottom:  1px solid black;
            margin-bottom: 16px;
            font-size: 20px;
            padding: 10px;
            outline: none;
        }
        .btn {
            background-color: black;
            color: white;
            border: none;
            padding: 10px 20px;
            font-weight: 600;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h3>Sign In</h3>
        <form action="" method="post">
            <label>Email</label>
            <input type="email" name="email" placeholder="abcd@example.com" class="input">
            <label>Password</label>
            <input type="password" name="password" placeholder="***********" class="input">
            <input type="submit" value="Sign In" class="btn">
        </form>
    </div>
</body>
</html>
